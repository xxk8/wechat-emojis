name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify published files
        run: |
          npm pack --dry-run 2>&1 | grep -q "dist/index.d.ts"
          npm pack --dry-run 2>&1 | grep -q "dist/index.js"
