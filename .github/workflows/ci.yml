name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify site build
        run: |
          npm run build:site
          npm run check:site
          test -z "$(git status --porcelain index.html)"
      - name: Verify production install without devDependencies
        run: |
          rm -rf "$RUNNER_TEMP/prod"
          mkdir -p "$RUNNER_TEMP/prod"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/prod"
          cd "$RUNNER_TEMP/prod"
          npm install --omit=dev
      - name: Verify scripts ship as TypeScript only
        run: |
          test -z "$(find scripts site -name '*.js' -o -name '*.mjs' -o -name '*.cjs' | head -1)"
          node scripts/verify-assets.ts
      - name: Verify packed package installs and loads
        run: |
          npm run check:package
          npm pack
          tar -tzf wechat-emojis-*.tgz | grep -q "^package/dist/index.d.ts$"
          if tar -tzf wechat-emojis-*.tgz | grep -Eq "^package/(site|scripts|src|examples)/"; then
            echo "development files leaked into the package" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/wechat-emojis-*.tgz >/dev/null
          node -e "const m=require('wechat-emojis'); if(typeof m.getEmojiPath!=='function'||m.getAllEmojis().length!==109) process.exit(1)"
          printf "%s\n" \
            "import { getEmojiPath, type EmojiName } from 'wechat-emojis';" \
            "const name: EmojiName = '微笑';" \
            "const path: string | null = getEmojiPath(name);" \
            "console.log(path);" > index.ts
          node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" --noEmit --strict --module commonjs --moduleResolution node index.ts
